# Simulation sidecar for riot_m31_emulation.toml (test unit only - never upload to RIOT)
# Values are in ENGINEERING units (mA); the unit stores microamps.

schema_version = 1
profile_id = "riot_m31_emulation"

[[sim]]
tag = "ai1"
mode = "sine"
min = 4.0
max = 20.0
period_s = 60
update_ms = 500

