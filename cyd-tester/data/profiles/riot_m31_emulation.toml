# RIOT Modbus Test Unit - RIOT M31 I/O rack emulation
# Serves the registers the RIOT's built-in M31 driver polls over Modbus TCP, so a
# RIOT "M31 Rack" can point at this test unit instead of real hardware:
#   DI1-4 FC2 wire 0-3, DO1-4 FC1 wire 0-3 (RIOT writes FC15),
#   AI1-4 FC4 wire 0-3 and AO1-4 FC3 wire 0-3 as uint16 microamps (RIOT writes AO with FC6).
# Values are SIMULATED. This is a test fixture, not the RIOT riot_m31 driver profile.

schema_version = 2

[device]
profile_id = "riot_m31_emulation"
profile_version = 1
vendor = "RIOT Test"
model = "M31 I/O Rack Emulation"
description = "Emulates the RIOT M31 rack's Modbus TCP register map"

[modbus]
unit_id = 1
address_format = "zero_based"

# ---- Analog inputs: uint16 microamps (0.001 mA) ----

[[tags]]
id = "ai1"
name = "AI1"
read_function = 4
register = 0
data_type = "uint16"
scale = 0.001
units = "mA"
access = "read"
default_enabled = true
poll_group = "io"
pool_group = "Analog Inputs"

[[tags]]
id = "ai2"
name = "AI2"
read_function = 4
register = 1
data_type = "uint16"
scale = 0.001
