register = 2002
data_type = "uint16"
access = "read"
default_enabled = false
poll_group = "slow"
pool_group = "Configuration"

[[tags]]
id = "rate_time_base"
name = "Rate Time Base"
description = "0=second; 1=minute; 2=hour; 3=day"
