# Profire PF2100; sources: Register Map v3.2 (July 2025), sections 3.1, 3.4, 3.5;
# Modbus Card Manual v1.1, Appendix C.
# Registers are printed Modbus reference numbers (address_format = "reference"); RIOT converts them to PDU offsets only on the wire.
# Temperature scale: 1 degree Celsius/count, regardless of display units.
# UNVERIFIED: 32/64-bit packing; live firmware/card applicability. No writable tags are defined.
# Omitted: setpoint signedness, ESD hardware applicability, unsupported packed status words.
schema_version = 2

[device]
profile_id = "profire_pf2100"
profile_version = 3
vendor = "Profire"
model = "PF2100"
description = "Profire PF2100 burner management controller"

[modbus]
transport = "rtu"
address_format = "reference"
unit_id = 10
short_packing = "AB"
# MSB first for 16-bit registers; no 32-bit values are defined here.
# Baud and unit ID must match the existing working connection.

[[tags]]
id = "run"
name = "Burner Run"
description = "1 = run active; not flame proof."
read_function = 2
register = 10001
data_type = "bool"
access = "read"
default_enabled = true
poll_group = "status"
pool_group = "Status"

[[tags]]
id = "pilot_output"
name = "Pilot Output"
description = "1 = energized; not position proof."
