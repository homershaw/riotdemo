# Emerson/Bristol 3808 MVT - READ-ONLY CDAB TRIAL
# Manufacturer source: Bristol CI-3808, February 2007, Appendix E, pp. 1-4.
# https://manuzoid.com/manuals/0ye4G-Remote%20Automation%20Solutions%20Bristol%203808%20Multivariable%20Owner%27s%20manual
# Cross-reference: Emerson 225AD-12b (April 2011), D301329X012, pp. 2-3.
# https://www.documentation.emersonprocess.com/intradoc-cgi/groups/public/documents/qbr/d301329x012.pdf
# TRIAL ASSUMPTIONS - NOT MANUFACTURER-VERIFIED:
# 1. CDAB float encoding, represented by LOW_HIGH (swap 16-bit words only).
# 2. Printed 16-bit register addresses are used unchanged on wire (zero_based).
# Check FC3 raw reads, address alignment, units and word order before enabling tags.
# Engineering units for DP/SP/T follow transmitter config registers 60/61/62;
# consequently the float tags do not declare fixed engineering units.
# No writes or calibration commands are defined.

schema_version = 2

[device]
profile_id = "emerson_3808_mvt_cdab_trial"
profile_version = 1
vendor = "Emerson"
model = "Bristol 3808 MVT"
description = "Read-only 3808 Modbus RTU CDAB trial; address and word-order validation pending"

[modbus]
transport = "rtu"
unit_id = 1
address_format = "zero_based"

[[tags]]
id = "differential_gauge_pressure"
name = "Differential / Gauge Pressure"
read_function = 3
register = 401
data_type = "float32"
word_order = "LOW_HIGH"
access = "read"
default_enabled = false
poll_group = "process"
pool_group = "Measurements"

[[tags]]
id = "static_pressure"
name = "Static Pressure"
read_function = 3
register = 403
data_type = "float32"
word_order = "LOW_HIGH"
access = "read"
default_enabled = false
poll_group = "process"
pool_group = "Measurements"

[[tags]]
