; RIOT Modbus TCP Test Unit (CYD-TESTER) - ESP32-2432S028R
; Arduino core 2.0.14 (espressif32 6.5.0): TFT_eSPI is reliable on core 2.x.

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.5.0
framework = arduino
board = esp32dev
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.embed_files =
    data/www/index.html.gz
    data/www/app.js.gz
    data/www/style.css.gz
board_build.embed_txtfiles =
    data/profiles/test_bench.toml
    data/sims/test_bench.sim.toml
    data/profiles/riot_m31_emulation.toml
    data/sims/riot_m31_emulation.sim.toml
monitor_speed = 115200
monitor_port = COM14
upload_port = COM14
upload_speed = 921600
extra_scripts = pre:tools/gzip_www.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -include "$PROJECT_INCLUDE_DIR/board_pins.h"
    -DTOML_EXCEPTIONS=0
    -DTOML_HEADER_ONLY=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
    ricmoo/QRCode@0.0.1

; Host-side unit tests: pio test -e native
; Builds only the Arduino-free parser, address map and codec. Needs a host GCC;
; tools/native_toolchain.py adds it to PATH for this build (override with CYD_HOST_GCC).
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DTOML_EXCEPTIONS=0
    -DTOML_HEADER_ONLY=1
    -Isrc
    -DUNITY_INCLUDE_DOUBLE
build_src_filter = -<*> +<profiles/profile.cpp> +<profiles/toml_chunks.cpp> +<profiles/sim_config.cpp> +<profiles/sim_engine.cpp> +<modbus/address_map.cpp> +<modbus/codec.cpp> +<modbus/value_store.cpp> +<modbus/request_handler.cpp>
test_build_src = yes
extra_scripts = pre:tools/native_toolchain.py
