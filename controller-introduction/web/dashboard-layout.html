<script>
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function layoutRequest(url,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const r=await fetch(url,{...options,cache:'no-store',signal:controller.signal});const result=await r.json();if(!r.ok||result.ok!==true)throw Error(result.error||('HTTP '+r.status));return result;}finally{clearTimeout(timer);}}
let dlRevision='',dlUsed=0,dlMaximum=0;
async function load(){const d=await layoutRequest('/api/dashboard-layout'),groups=d.groups||[],items=d.items||[],sources=d.sources||[];
 if(typeof d.revision!=='string')throw Error('Missing layout revision');dlRevision=d.revision;
 if(!Number.isInteger(d.usedItems)||!Number.isInteger(d.maximumItems)||d.usedItems!==items.length||
    d.usedItems<0||d.maximumItems<1||d.usedItems>d.maximumItems)throw Error('Invalid Dashboard capacity');
 dlUsed=d.usedItems;dlMaximum=d.maximumItems;
 document.getElementById('dlCapacity').textContent='Dashboard: '+dlUsed+' / '+dlMaximum;
 document.getElementById('dlStatus').textContent=(d.store==='INVALID_FILE'?'Saved layout is invalid and was retained; explicit Restore Factory Layout is required before saves.':d.custom?'Custom Dashboard layout saved.':'Generated factory layout; it is not saved until you make a change.'+(d.factoryOmitted?' '+d.factoryOmitted+' visible legacy items exceed the 64-item limit and are not placed; manage assignments in Tags.':''))+' Tag Manager owns process Tag assignment and display name. Existing hidden placements remain assigned and hidden; use Tag Manager to explicitly remove or reassign them.';
 const statusLabels=['time','ethernet','wifi','tagHealth'];statusLabels.forEach((name,index)=>document.querySelector('input[name="'+name+'"]').checked=!!(d.statusMask&(1<<index)));
 const devices=sources.filter(x=>x.ref.startsWith('DEV.'));document.getElementById('dlPrimaryDevice').innerHTML='<option value="">I/O UNASSIGNED</option>'+devices.map(x=>'<option value="'+e(x.ref)+'">'+e(x.label)+' · '+e(x.value)+'</option>').join('');
 document.getElementById('dlPrimaryDevice').value=d.primaryDevice||'';
 if(d.primaryDevice&&!devices.some(x=>x.ref===d.primaryDevice)){document.getElementById('dlPrimaryDevice').add(new Option(d.primaryDevice+' · UNAVAILABLE',d.primaryDevice));document.getElementById('dlPrimaryDevice').value=d.primaryDevice;}
 document.getElementById('dlGroups').innerHTML=groups.map(g=>'<article class="dlGroup" data-dash-group="'+g.id+'"><label><span>Group Name</span><input data-field="name" maxlength="24" value="'+e(g.name)+'" required></label><label><span>Order</span><input data-field="order" type="number" min="1" max="255" value="'+g.order+'" required></label><label class="check"><span>Visible</span><input data-field="visible" type="checkbox" '+(g.visible?'checked':'')+'></label><label class="check"><span>Collapsed by Default</span><input data-field="collapsed" type="checkbox" '+(g.collapsed?'checked':'')+'></label><label class="check"><span>Delete</span><input data-field="remove" type="checkbox"></label></article>').join('')||'<p>No groups.</p>';
 const assigned=items;
 function itemRow(x){
  const multiple=x.placements>1,owned=x.tagOwned,immutable=owned||multiple;
  const protect=condition=>condition?' data-protected disabled':'';
  return '<article class="dlItem" data-dash-item data-index="'+items.indexOf(x)+'" data-ref="'+e(x.ref)+'"><label><span>Display Name</span><input data-field="label" maxlength="35" value="'+e(x.label)+'" required'+protect(immutable)+'></label><label><span>Group</span><select data-field="groupId"'+protect(multiple)+'>'+groups.map(g=>'<option value="'+g.id+'" '+(g.id===x.groupId?'selected':'')+'>'+e(g.name)+'</option>').join('')+'</select></label><label><span>Order</span><input data-field="order" type="number" min="1" max="255" value="'+x.order+'" required'+protect(multiple)+'></label>'+
   '<label class="check"><span>Show</span><input data-field="visible" type="checkbox" '+(x.visible?'checked':'')+protect(immutable)+(immutable?' hidden':'')+'>'+(immutable?(x.visible?'Visible':'Hidden'):'')+'</label>'+
   '<label class="check"><span>Unassign</span><input data-field="remove" type="checkbox"'+protect(immutable)+(immutable?' hidden':'')+'>'+(immutable?'<a class="rowEdit" href="'+(owned?'/tags-editor?name='+encodeURIComponent(x.ref.slice(4)):'/dashboard-layout')+'">Configure</a>':'')+'</label><small>'+e(x.ref)+' · '+e(x.value||'')+(x.units?' '+e(x.units):'')+' · '+(x.available?e(x.quality):'UNAVAILABLE')+(multiple?' · Multiple Dashboard placements':owned?' · Display name / assignment owned by Tag Manager':'')+'</small></article>';
 }
 document.getElementById('dlAssigned').innerHTML=assigned.map(itemRow).join('')||'<p>No assigned items.</p>';
}
let dlDirty=false,dlSaving=false,dlLoaded=false,dlNeedsReload=false;
const editor=document.getElementById('dlEditor'),feedback=document.getElementById('dlSaveFeedback');
editor.addEventListener('input',markLayoutDirty);editor.addEventListener('change',markLayoutDirty);
function markLayoutDirty(ev){dlDirty=true;feedback.textContent='Unsaved changes';}
window.addEventListener('beforeunload',ev=>{if(dlDirty||dlSaving){ev.preventDefault();ev.returnValue='';}});
editor.addEventListener('submit',ev=>{
 const f=ev.target;if(!f.matches('form[action="/api/dashboard-layout/action"]'))return;
 if(dlSaving||!dlLoaded||dlNeedsReload){ev.preventDefault();feedback.textContent='Reload the layout before continuing.';return;}
 if(dlDirty){ev.preventDefault();feedback.textContent='Save Changes before adding, assigning, or restoring the layout.';return;}
 if(f.classList.contains('dlAdd')&&dlUsed>=dlMaximum){ev.preventDefault();feedback.textContent='Dashboard capacity: '+dlUsed+' / '+dlMaximum+'. Review assignments before adding more.';return;}
 let revision=f.elements.revision;if(!revision){revision=document.createElement('input');revision.type='hidden';revision.name='revision';f.append(revision);}revision.value=dlRevision;
 if(f.elements.action.value==='factory-reset'&&!confirm('Restore the generated factory Dashboard layout? The custom Dashboard layout file will be removed.'))ev.preventDefault();
});
function fields(row){return Object.fromEntries(Array.from(row.querySelectorAll('[data-field]'),x=>[x.dataset.field,x]));}
function encoded(value){const text=encodeURIComponent(value);return text.length+':'+text;}
function lockEditor(locked){editor.querySelectorAll('input,select,button').forEach(x=>x.disabled=locked||x.hasAttribute('data-protected'));}
document.getElementById('dlSaveChanges').addEventListener('click',async()=>{
 if(dlSaving||!dlLoaded||dlNeedsReload)return;
 for(const input of editor.querySelectorAll('[data-field]')){if(!input.reportValidity())return;}
 const rows=Array.from(document.querySelectorAll('[data-dash-item]')).sort((a,b)=>Number(a.dataset.index)-Number(b.dataset.index)),groupRows=Array.from(document.querySelectorAll('[data-dash-group]'));
 if(rows.filter(row=>!fields(row).remove.checked).length>dlMaximum){feedback.textContent='Dashboard item limit reached; no save submitted.';return;}
 const payload=rows.map(row=>{const f=fields(row);return encoded(row.dataset.ref)+encoded(f.label.value)+f.groupId.value+','+f.order.value+','+(f.visible.checked?1:0)+','+(f.remove.checked?1:0)+';';}).join('');
 const groupsPayload=groupRows.map(row=>{const f=fields(row);return encoded(f.name.value)+row.dataset.dashGroup+','+f.order.value+','+(f.visible.checked?1:0)+','+(f.collapsed.checked?1:0)+','+(f.remove.checked?1:0)+';';}).join('');
 const body=new URLSearchParams({action:'layout-save',payload,groupsPayload,primaryDevice:document.getElementById('dlPrimaryDevice').value,ajax:'1',revision:dlRevision});
 ['time','ethernet','wifi','tagHealth'].forEach(name=>{if(editor.querySelector('[name="'+name+'"]').checked)body.set(name,'1');});
 const scroll=window.scrollY;dlSaving=true;lockEditor(true);feedback.textContent='Saving...';
 try{await layoutRequest('/api/dashboard-layout/action',{method:'POST',body});dlDirty=false;
  try{await load();window.scrollTo(0,scroll);feedback.textContent='Saved';}
  catch(err){dlNeedsReload=true;feedback.textContent='Saved, but refresh failed: '+err.message+'. Reload before further changes.';}
 }
 catch(err){feedback.textContent='Save failed: '+err.message;}
 finally{dlSaving=false;if(!dlNeedsReload)lockEditor(false);}
});
lockEditor(true);load().then(()=>{dlLoaded=true;lockEditor(false);}).catch(err=>{document.getElementById('dlStatus').textContent='Could not load Dashboard layout: '+err.message+'. Reload to retry.';});
</script>
